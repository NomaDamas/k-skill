# HOL AI Plugin Scanner: scores this repository on every push and pull request.
# - Read-only token, no secrets, checkout credentials are not persisted.
# - Every action is pinned to a full commit SHA; the scanner wheel is verified
#   against a committed SHA-256 and PyPI provenance before it runs.
# Guide: https://github.com/hashgraph-online/awesome-ai-plugins/blob/main/SCANNER_GUIDE.md
name: HOL Plugin Scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hol-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          min_score: 75
          fail_on_severity: none
